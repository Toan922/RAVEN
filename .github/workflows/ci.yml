# Runs the test suite on every push to main and every pull request into main.
# The job name "tests" is the status check to require in the main branch ruleset.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# a newer push to the same branch or PR cancels the run still going
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # the console's tests open Qt windows; there's no screen on the runner
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install system libraries for Qt (PySide6, QtWebEngine map)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libgbm1 libxkbcommon0 libxkbcommon-x11-0 libdbus-1-3 libfontconfig1 \
            libnss3 libxcomposite1 libxdamage1 libxrandr2 libxtst6 libxshmfence1 libasound2t64

      # CPU-only PyTorch first, so ultralytics doesn't pull the multi-GB CUDA build; tests never use a GPU
      - name: Install CPU PyTorch
        run: pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu

      - name: Install RAVEN and test dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest tests/ -q
